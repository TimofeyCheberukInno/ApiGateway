name: API Gateway CI pipeline

on:
  push:
    branches:
      [ main ]
  pull_request:
    branches:
      [ main ]
    types:
      [ opened, synchronize, reopened ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: JDK setup
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: ./impl/pom.xml

    - name: Run maven packaging
      run: mvn clean package
      working-directory: ./impl

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t api-gateway:latest -f ./impl/deploy/Dockerfile ./impl

      - name: Save docker image to tar
        run: docker save api-gateway:latest | gzip > api-gateway.tar.gz

      - name: Upload docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-docker-image
          path: api-gateway.tar.gz
